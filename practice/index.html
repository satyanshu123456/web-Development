<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="main1D">
      <div class="mainD">
        <div class="secD">
          <h3>Login Form</h3>
          <form id="loginForm">
            <label for="name">Name:-</label>
            <input type="text" id="name" placeholder="Name" class="inp" required />
            <br /><br />

            <label for="email">Email:-</label>
            <input type="email" id="email" placeholder="Email" class="inp" required />
            <br /><br />

            <label for="pass">Password:-</label>
            <input type="password" id="pass" placeholder="Password" class="inp" required />
            <br /><br />

            <label for="cnPass">Confirm Password:-</label>
            <input type="password" id="cnPass" placeholder="Confirm Password" class="inp" required />

            <div class="btn1">
              <button type="submit" class="btn">submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
